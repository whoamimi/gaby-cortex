<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SSE Client</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      body { margin: 24px; max-width: 980px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      label { display: grid; gap: 6px; font-size: 13px; color: #333; }
      input { padding: 10px 12px; border: 1px solid #ccc; border-radius: 10px; min-width: 220px; }
      button { padding: 10px 14px; border: 1px solid #ccc; border-radius: 10px; background: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .pill { display: inline-block; padding: 6px 10px; border: 1px solid #444; border-radius: 999px; color: #444; }
      pre {
        margin-top: 16px;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: #fafafa;
        height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.35;
        font-size: 13px;
      }
      .meta { margin-top: 10px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .k { color: #666; font-size: 13px; }
      code { background: #f2f2f2; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>

  <body>
    <h1>SSE Client</h1>

    <div class="row">
      <label>
        Session ID
        <input id="sid" placeholder="e.g. demo-testing-id" value="demo-testing-id" />
      </label>

      <label>
        filename
        <input id="filename" placeholder="demo.csv" value="demo.csv" />
      </label>

      <label>
        dataType
        <input id="dataType" placeholder="demo-data" value="demo-data" />
      </label>

      <label>
        databaseType
        <input id="databaseType" placeholder="demo-db" value="demo-db" />
      </label>

      <label>
        dataPlatformType
        <input id="dataPlatformType" placeholder="demo-platform" value="demo-platform" />
      </label>
    </div>

    <div class="meta">
      <span class="pill" id="status">disconnected</span>
      <span class="k">Last Event ID: <code id="eid">—</code></span>

      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
      <button id="clear">Clear</button>
    </div>

    <pre id="out"></pre>

    <script src="/static/js/script.js"></script>
  </body>
</html>
