
title: "DataBy AI Docs"
remote_theme: mmistakes/minimal-mistakes
logo: /assets/logo.svg
color_scheme: dark
author: Mimi Phan 
email: phan.mimi@outlook.com 
markdown: kramdown
timezone: "Australia/Sydney"

url: https://whoamimi.github.io
baseurl: /databy-ai
repository: whoamimi/databy-ai

mermaid:
  version: "10.6.0"
  theme: "neo-dark"

show_downloads: true
# Custom CSS for dark theme
defaults:
  -
    scope:
      path: ""
      type: "docs"
    values:
      layout: "default"

nav:
  - Home: index.md

sidebar:
  - Home: index.md
  - AI & Data Science: pages/1_ai_agents.md

aux_links:
  App: https://databy.ai
  Github: https://github.com/whoamimi/databy-ai

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
