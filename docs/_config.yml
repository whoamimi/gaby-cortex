
title: "DataBy AI Docs"
remote_theme: mmistakes/minimal-mistakes
logo: /assets/logo.svg
color_scheme: light

author: Mimi Phan 
email: phan.mimi@outlook.com 
markdown: kramdown
timezone: "Australia/Sydney"

url: https://whoamimi.github.io
baseurl: /databy-ai
repository: whoamimi/databy-ai

mermaid:
  version: "10.6.0"
  theme: "neo-dark"

show_downloads: true
# Custom CSS for dark theme
defaults:
  -
    scope:
      path: "/pages"
      type: "docs"
    values:
      layout: "default"

sidebar:
  - Home: index.md
  - AI & Data Science: pages/1_ai_agents.md

aux_links:
  DataBy AI App: 
    url: https://databy.ai
    icon: fas fa-robot

  Github: 
    url: https://github.com/whoamimi/databy-ai
    icon: fab fa-github

  Wordpress: 
    url: https://mimiphanblog.wordpress.com/
    icon: fas fa-blog

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

footer_content: "Copyright &copy; 2025 DataBy AI. Distributed under the <a href=\"https://github.com/whoamimi/databy-ai/blob/main/LICENSE\">MIT License</a>."

