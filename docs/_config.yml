
title: "DataBy AI Docs"
remote_theme: just-the-docs/just-the-docs # "mmistakes/minimal-mistakes@4.24.0"
logo: /assets/logo.svg
description: "Documentation for DataBy AI"
color_scheme: light

author: Mimi Phan
email: phan.mimi@outlook.com
timezone: "Australia/Sydney"
markdown: kramdown
highlighter: rouge
breadcrumbs: true
heading_anchors: false

url: https://whoamimi.github.io
baseurl: /databy-ai
repository: whoamimi/databy-ai

mermaid:
  version: "10.6.0"
  theme: "neo-dark"

sidebar:
  logo: /assets/logo.svg
  title: "DataBy AI Docs"

navbar:
  title: "DataBy AI Docs"
  logo: /assets/logo.svg

aux_links:
  DataBy AI App: https://databy.ai
  Github: https://github.com/whoamimi/databy-ai
  Wordpress: https://mimiphanblog.wordpress.com/

aux_links_position: top
aux_links_style: icons

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

footer_content: "Copyright &copy; 2025 DataBy AI. Distributed under the <a href=\"https://github.com/whoamimi/databy-ai/blob/main/LICENSE\">MIT License</a>."
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"
gh_edit_link: false
gh_edit_repository: "https://github.com/whoamimi/databy-ai"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"


collections:
  posts:
    output: true
    permalink: "/:collection/:path/"

just_the_docs:
  collections:
    posts:
      enabled: true
      name: Documentation
      nav_order: 1
      nav_fold: true

  search_enabled: true
  toc:
    min_level: 2
    max_level: 4
  show_toc_on_pages: true
  show_toc_on_posts: false
  show_toc_on_docs: true
  toc_sticky: true
  toc_collapsible: true
  toc_collapsed_by_default: false

  social_sharing:
    enabled: true
    twitter_username: whoamimi
    facebook_app_id: ""
    linkedin_username: ""